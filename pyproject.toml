[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "janelia-pathlib"
dynamic = ["version"]
description = "Translate Janelia file share paths to/from an unambiguous janelia:// URI"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
]

[project.scripts]
janelia-paths-fetch = "janelia_pathlib._fetch:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/janelia_pathlib/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/janelia_pathlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.14",
    "ruff>=0.9",
    "pre-commit>=4.0",
]
